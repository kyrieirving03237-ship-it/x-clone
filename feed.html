<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Clone - タイムライン</title>
  <style>
    :root {
      --bg: #060610;
      --surface: #0d0d1a;
      --surface2: #111122;
      --border: rgba(255,255,255,0.08);
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --text: #e7e9ea;
      --text-muted: #71767b;
      --error: #f4212e;
      --danger: rgba(244,33,46,0.15);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(29,155,240,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(120,86,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6,6,16,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
    }

    .logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }

    .user-info { display: flex; align-items: center; gap: 12px; }

    .user-email {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--text-muted);
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-logout:hover { border-color: var(--error); color: var(--error); }

    main { max-width: 600px; margin: 0 auto; padding: 0 16px 60px; }

    .compose {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin: 20px 0;
    }

    textarea {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-size: 17px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 80px;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--text-muted); }

    .compose-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .char-count { font-size: 13px; color: var(--text-muted); transition: color 0.2s; }
    .char-count.warn { color: #ffd400; }
    .char-count.over { color: var(--error); }

    .btn-post {
      background: var(--accent);
      border: none;
      border-radius: 9999px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-post:hover { background: var(--accent-hover); }
    .btn-post:disabled { opacity: 0.4; cursor: not-allowed; }

    .timeline-label { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; padding-left: 4px; }

    .post {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 10px;
      transition: background 0.15s;
    }

    .post:hover { background: var(--surface2); }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .post-meta { display: flex; align-items: center; gap: 8px; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #7856ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .post-author { font-size: 14px; font-weight: 600; }
    .post-time { font-size: 12px; color: var(--text-muted); }

    .post-content {
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-delete:hover { background: var(--danger); color: var(--error); }

    .empty { text-align: center; color: var(--text-muted); padding: 60px 0; font-size: 15px; }
    .loading { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
    .post-error { color: var(--error); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦ xclone</div>
    <div class="user-info">
      <span class="user-email" id="user-email"></span>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="compose">
      <textarea id="compose-text" placeholder="いまどうしてる？" maxlength="280" oninput="onCompose()"></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 280</span>
        <button class="btn-post" id="post-btn" onclick="postTweet()" disabled>投稿</button>
      </div>
      <div class="post-error" id="post-error"></div>
    </div>

    <div class="timeline-label">タイムライン</div>
    <div id="timeline"><div class="loading">読み込み中...</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'

    const { createClient } = supabase
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let currentUser = null

    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) return location.href = 'index.html'
      currentUser = session.user
      document.getElementById('user-email').textContent = currentUser.email
      loadPosts()
      subscribeRealtime()
    })

    async function logout() {
      await sb.auth.signOut()
      location.href = 'index.html'
    }

    function onCompose() {
      const text = document.getElementById('compose-text').value
      const len = text.length
      const counter = document.getElementById('char-count')
      counter.textContent = `${len} / 280`
      counter.className = 'char-count' + (len >= 280 ? ' over' : len >= 240 ? ' warn' : '')
      document.getElementById('post-btn').disabled = len === 0 || len > 280
    }

    async function postTweet() {
      const content = document.getElementById('compose-text').value.trim()
      if (!content) return
      const btn = document.getElementById('post-btn')
      btn.disabled = true
      btn.textContent = '投稿中...'
      document.getElementById('post-error').textContent = ''
      const { error } = await sb.from('posts').insert({
        user_id: currentUser.id,
        user_email: currentUser.email,
        content
      })
      btn.textContent = '投稿'
      if (error) {
        document.getElementById('post-error').textContent = error.message
        btn.disabled = false
        return
      }
      document.getElementById('compose-text').value = ''
      onCompose()
    }

    async function loadPosts() {
      const { data, error } = await sb
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(50)
      const el = document.getElementById('timeline')
      if (error) {
        el.innerHTML = `<div class="empty">読み込みエラー: ${error.message}</div>`
        return
      }
      renderPosts(data)
    }

    function renderPosts(posts) {
      const el = document.getElementById('timeline')
      if (!posts || posts.length === 0) {
        el.innerHTML = '<div class="empty">まだ投稿がありません。最初のつぶやきをしてみよう！</div>'
        return
      }
      el.innerHTML = posts.map(p => postHTML(p)).join('')
    }

    function postHTML(p) {
      const initial = (p.user_email || p.user_id || '?')[0].toUpperCase()
      const time = formatTime(p.created_at)
      const isOwn = currentUser && p.user_id === currentUser.id
      const deleteBtn = isOwn
        ? `<button class="btn-delete" onclick="deletePost('${p.id}', this)">削除</button>`
        : ''
      const escaped = p.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      return `
        <div class="post" id="post-${p.id}">
          <div class="post-header">
            <div class="post-meta">
              <div class="avatar">${initial}</div>
              <div>
                <div class="post-author">${p.user_email || 'ユーザー'}</div>
                <div class="post-time">${time}</div>
              </div>
            </div>
            ${deleteBtn}
          </div>
          <div class="post-content">${escaped}</div>
        </div>
      `
    }

    async function deletePost(id, btn) {
      btn.disabled = true
      const { error } = await sb.from('posts').delete().eq('id', id)
      if (error) { btn.disabled = false; return }
      document.getElementById('post-' + id)?.remove()
    }

    function subscribeRealtime() {
      sb.channel('posts-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
          const timeline = document.getElementById('timeline')
          const empty = timeline.querySelector('.empty')
          if (empty) timeline.innerHTML = ''
          const div = document.createElement('div')
          div.innerHTML = postHTML(payload.new)
          timeline.insertBefore(div.firstElementChild, timeline.firstChild)
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'posts' }, payload => {
          document.getElementById('post-' + payload.old.id)?.remove()
        })
        .subscribe()
    }

    function formatTime(iso) {
      const d = new Date(iso)
      const now = new Date()
      const diff = Math.floor((now - d) / 1000)
      if (diff < 60) return `${diff}秒前`
      if (diff < 3600) return `${Math.floor(diff/60)}分前`
      if (diff < 86400) return `${Math.floor(diff/3600)}時間前`
      return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' })
    }
  </script>
</body>
</html>
