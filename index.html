<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Clone - ログイン</title>
  <style>
    :root {
      --bg: #060610;
      --surface: #0d0d1a;
      --border: rgba(255,255,255,0.08);
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --text: #e7e9ea;
      --text-muted: #71767b;
      --error: #f4212e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(29,155,240,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(120,86,255,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      padding: 12px 0;
      cursor: pointer;
      transition: color 0.2s;
      position: relative;
    }

    .tab.active { color: var(--text); }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 25%;
      width: 50%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 9999px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .message.error { color: var(--error); }
    .message.success { color: #00ba7c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✦ xclone</div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">ログイン</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">新規登録</button>
    </div>

    <div id="form-login">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="login-password" placeholder="パスワード">
      </div>
      <button class="btn" id="login-btn" onclick="login()">ログイン</button>
    </div>

    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="signup-password" placeholder="パスワード">
      </div>
      <button class="btn" id="signup-btn" onclick="signup()">アカウント作成</button>
    </div>

    <div class="message" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'

    const { createClient } = supabase
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = 'feed.html'
    })

    function switchTab(tab) {
      const isLogin = tab === 'login'
      document.getElementById('tab-login').className = 'tab' + (isLogin ? ' active' : '')
      document.getElementById('tab-signup').className = 'tab' + (!isLogin ? ' active' : '')
      document.getElementById('form-login').style.display = isLogin ? '' : 'none'
      document.getElementById('form-signup').style.display = isLogin ? 'none' : ''
      showMsg('')
    }

    function showMsg(text, isError = true) {
      const el = document.getElementById('msg')
      el.textContent = text
      el.className = 'message ' + (isError ? 'error' : 'success')
    }

    function setLoading(btnId, loading) {
      document.getElementById(btnId).disabled = loading
      document.getElementById(btnId).textContent = loading
        ? '処理中...'
        : (btnId === 'login-btn' ? 'ログイン' : 'アカウント作成')
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim()
      const password = document.getElementById('login-password').value
      if (!email || !password) return showMsg('メールとパスワードを入力してください')
      setLoading('login-btn', true)
      const { error } = await sb.auth.signInWithPassword({ email, password })
      setLoading('login-btn', false)
      if (error) return showMsg(error.message)
      location.href = 'feed.html'
    }

    async function signup() {
      const email = document.getElementById('signup-email').value.trim()
      const password = document.getElementById('signup-password').value
      if (!email || !password) return showMsg('メールとパスワードを入力してください')
      if (password.length < 6) return showMsg('パスワードは6文字以上にしてください')
      setLoading('signup-btn', true)
      const { error } = await sb.auth.signUp({ email, password })
      setLoading('signup-btn', false)
      if (error) return showMsg(error.message)
      showMsg('アカウントを作成しました！ログインしてください', false)
      switchTab('login')
    }
  </script>
</body>
</html>
